name: RainTrack CR - sonda OVSICORI/RSN (temporal)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Mirar robots.txt y enlaces de OVSICORI y RSN
        run: |
          python3 - <<'PY'
          import re, urllib.request, ssl
          ctx = ssl.create_default_context()
          url = "https://www.ovsicori.una.ac.cr/sistemas/mapa_sismicidad/mapa_sismos.php"
          req = urllib.request.Request(url, headers={"User-Agent": "RainTrackCR-probe (https://github.com/Allan101010/RAINROAD)"})
          with urllib.request.urlopen(req, timeout=30, context=ctx) as r:
              body = r.read(2000000).decode("utf-8", "replace")
          for kw in ("circleMarker", "L.marker", "L.circle", "bindPopup", "var sismos", "var data", "magnitud", "Magnitud", "fecha", "hora", "<table", "$.get", "$.ajax", "fetch(", "XMLHttp"):
              print(kw, len(re.findall(re.escape(kw), body)))
          for kw in ("bindPopup", "circleMarker", "L.marker", "Magnitud", "magnitud"):
              i = body.find(kw)
              if i >= 0:
                  print("==== ", kw, "::", re.sub(r"\s+", " ", body[max(0,i-500):i+700]))
          # fin del documento, donde suele estar el JS con los datos
          print("==== FINAL ::", re.sub(r"\s+", " ", body[-1500:]))
          PY
