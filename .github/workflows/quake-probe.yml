name: RainTrack CR - sonda OVSICORI/RSN (temporal)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Mirar robots.txt y enlaces de OVSICORI y RSN
        run: |
          python3 - <<'PY'
          import re, urllib.request, ssl
          ctx = ssl.create_default_context()
          def get(url, limit=400000):
              req = urllib.request.Request(url, headers={"User-Agent": "RainTrackCR-probe (https://github.com/Allan101010/RAINROAD)"})
              try:
                  with urllib.request.urlopen(req, timeout=25, context=ctx) as r:
                      return r.status, r.headers.get("content-type"), r.read(limit).decode("utf-8", "replace")
              except Exception as e:
                  return None, None, repr(e)
          for site in ("https://www.ovsicori.una.ac.cr", "https://rsn.ucr.ac.cr"):
              print("=====", site)
              st, ct, body = get(site + "/robots.txt")
              print("robots:", st, ct); print(body[:600])
              st, ct, body = get(site + "/")
              print("home:", st, ct, len(body))
              links = sorted(set(re.findall(r'(?:href|src)=["\']([^"\']+)["\']', body)))
              for l in links:
                  if re.search(r'sism|mapa|map|json|rss|feed|api|\.php', l, re.I):
                      print("  link:", l[:160])
          PY
