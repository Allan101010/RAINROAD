name: RainTrack CR - sonda OVSICORI/RSN (temporal)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Mirar robots.txt y enlaces de OVSICORI y RSN
        run: |
          python3 - <<'PY'
          import re, urllib.request, ssl, html, datetime as d
          ctx = ssl.create_default_context()
          url = "https://www.ovsicori.una.ac.cr/sistemas/mapa_sismicidad/mapa_sismos.php"
          req = urllib.request.Request(url, headers={"User-Agent": "RainTrackCR-probe (https://github.com/Allan101010/RAINROAD)"})
          with urllib.request.urlopen(req, timeout=30, context=ctx) as r:
              body = r.read(3000000).decode("utf-8", "replace")
          print("ahora UTC", d.datetime.now(d.timezone.utc).strftime("%Y-%m-%d %H:%M:%S"))
          rows = []
          for m in re.finditer(r"var eq(\d+) = L\.icon\(.*?L\.marker\(\[([-\d.]+),\s*([-\d.]+)\].*?bindPopup\('(.*?)',\{minWidth", body, re.S):
              eid, lat, lon, popup = m.groups()
              txt = re.sub(r"<[^>]+>", "|", popup); txt = re.sub(r"\|+", "|", html.unescape(txt))
              mag = re.search(r"Magnitud:\|([\d.]+)", txt); when = re.search(r"Hora Local:\|([\d-]+ [\d:]+)", txt)
              place = re.search(r"Ubicacion:\|([^|]+)", txt); dep = re.search(r"Prof\. \[km\]:\|([\d.]+)", txt)
              auth = re.search(r"Autor:\|([^|]*)", txt); rev = re.search(r"Revisado:\|([^|]*)", txt)
              rows.append((when.group(1) if when else "?", eid, float(lat), float(lon), mag.group(1) if mag else "?", place.group(1) if place else "?", dep.group(1) if dep else "?", auth.group(1) if auth else "?", rev.group(1) if rev else "?"))
          print("eventos en la pagina:", len(rows))
          rows.sort(reverse=True)
          print("rango:", rows[-1][0], "->", rows[0][0])
          for r in rows[:12]: print("OVS", r)
          print("---- cerca de 8.4,-83.0 hoy:")
          for r in rows:
              if r[0].startswith("2026-11-14 2") and abs(r[2]-8.44) < 0.4 and abs(r[3]+83.03) < 0.5: print("OVS*", r)
          import collections
          print("autores:", collections.Counter(r[7] for r in rows).most_common(6))
          print("mag>=3.5:", sum(1 for r in rows if r[4] != "?" and float(r[4]) >= 3.5))
          PY
