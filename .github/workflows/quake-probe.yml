name: RainTrack CR - sonda de temblores (temporal)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Consultar USGS (consulta FDSN) y EMSC
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, datetime as d
          now = d.datetime.now(d.timezone.utc)
          start = (now - d.timedelta(hours=4)).strftime("%Y-%m-%dT%H:%M:%S")
          print("ahora UTC", now.strftime("%H:%M:%S"))
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "RainTrackCR-probe"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          q = urllib.parse.urlencode({"format": "geojson", "starttime": start, "minlatitude": 4.5, "maxlatitude": 13.5, "minlongitude": -89, "maxlongitude": -80.5, "minmagnitude": 2.5, "orderby": "time"})
          for f in get("https://earthquake.usgs.gov/fdsnws/event/1/query?" + q)["features"]:
              p = f["properties"]; c = f["geometry"]["coordinates"]
              print("USGS", d.datetime.fromtimestamp(p["time"]/1000, d.timezone.utc).strftime("%H:%M:%S"), p["mag"], p["magType"], p["place"], c[1], c[0], "actualizado", d.datetime.fromtimestamp(p["updated"]/1000, d.timezone.utc).strftime("%H:%M:%S"))
          q = urllib.parse.urlencode({"format": "json", "start": start, "minlat": 4.5, "maxlat": 13.5, "minlon": -89, "maxlon": -80.5, "minmag": 2.5, "orderby": "time", "limit": 50})
          for f in get("https://www.seismicportal.eu/fdsnws/event/1/query?" + q)["features"]:
              p = f["properties"]
              print("EMSC", p["time"][11:19], p["mag"], p.get("magtype"), p.get("flynn_region"), p["lat"], p["lon"], "auth", p.get("auth"), "actualizado", str(p.get("lastupdate"))[11:19])
          PY
