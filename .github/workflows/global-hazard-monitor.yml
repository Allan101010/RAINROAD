name: RainTrack CR — global hazard feeds
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/ingest_global_events.py"
      - "config/global-sources.json"
      - "requirements-global-monitor.txt"
      - ".github/workflows/global-hazard-monitor.yml"
permissions:
  contents: write
concurrency:
  group: raintrack-global-hazard-monitor
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-global-monitor.txt
      - name: Install dependencies
        run: pip install -r requirements-global-monitor.txt
      - name: Fetch and normalize public feeds
        run: python scripts/ingest_global_events.py
      - name: Publish global events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-events.json
          if git diff --cached --quiet; then
            echo "No global event changes."
          else
            git commit -m "Update normalized global hazard events"
            git push
          fi
