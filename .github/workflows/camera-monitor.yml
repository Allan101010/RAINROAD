name: RainTrack CR - monitoreo de cámaras

on:
  push:
    branches:
      - main
    paths:
      - "scripts/monitor_cameras.py"
      - "config/camera-sources.json"
      - "requirements-camera-monitor.txt"
      - ".github/workflows/camera-monitor.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raintrack-camera-monitor
  cancel-in-progress: false

jobs:
  monitor-cameras:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-camera-monitor.txt

      - name: Restaurar modelo de IA en caché
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: raintrack-weather-scene-models-v2

      - name: Instalar motor OCR para leer fechas de las cámaras
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Instalar PyTorch CPU
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0

      - name: Instalar dependencias del monitor
        run: pip install -r requirements-camera-monitor.txt

      - name: Consultar cámaras y analizar imágenes
        run: python scripts/monitor_cameras.py

      - name: Publicar resultados para GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add camera-alerts.json camera-catalog.json
          if git diff --cached --quiet; then
            echo "No hay cambios que publicar."
          else
            git commit -m "Actualizar monitoreo meteorológico de cámaras"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::warning::Se detectó una actualización simultánea de los JSON meteorológicos; se conservarán los resultados de este ciclo."
              conflicts="$(git diff --name-only --diff-filter=U)"
              unexpected="$(echo "$conflicts" | grep -Ev '^(camera-alerts.json|camera-catalog.json)$' || true)"
              if [ -n "$unexpected" ]; then
                git rebase --abort || true
                echo "::error::Conflicto inesperado fuera de los JSON generados: $unexpected"
                exit 1
              fi
              while IFS= read -r file; do
                [ -n "$file" ] || continue
                git checkout --theirs -- "$file"
                git add "$file"
              done <<< "$conflicts"
              GIT_EDITOR=true git rebase --continue
            fi
            git push origin HEAD:main
          fi
