name: RainTrack tests and validation
on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "assets/**"
      - "index.html"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-camera-monitor.txt
      - run: pip install requests==2.32.3 beautifulsoup4==4.13.4 Pillow==11.2.1 pytesseract==0.3.13
      - run: python -m py_compile scripts/monitor_cameras.py
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check assets/app.js
      - name: Validate JSON documents
        run: |
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path('.').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          print('JSON files valid')
          PY
