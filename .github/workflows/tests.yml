name: RainTrack tests and validation
on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "assets/**"
      - "index.html"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/**"
      - "assets/**"
      - "index.html"
      - "sw.js"
      - ".github/workflows/tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-camera-monitor.txt
      - run: pip install -r requirements-camera-monitor.txt
      - run: python -m py_compile scripts/monitor_cameras.py
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Revisar la sintaxis de todo el JavaScript
        run: for f in assets/*.js sw.js; do node --check "$f"; done
      - name: Pruebas de la lógica de la app (rutas, lluvia de la cámara de casa)
        run: for t in tests/*.test.js; do node "$t"; done
      - name: Validate JSON documents
        run: |
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path('.').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          print('JSON files valid')
          PY
